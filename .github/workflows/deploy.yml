name: Testar e publicar
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verificar segredo
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."; exit 1; fi
      - name: Publicar
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          npx -y wrangler@4 deploy
          npx -y wrangler@4 d1 migrations apply universo --remote
      - name: Carregar dados iniciais (só com o banco vazio)
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          n=$(npx -y wrangler@4 d1 execute universo --remote --json --command "SELECT COUNT(*) AS n FROM weddings" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')
          if [ "$n" = "0" ]; then node scripts/seed.mjs > seed.sql && npx -y wrangler@4 d1 execute universo --remote --file=seed.sql; else echo "Banco já tem $n casamento(s); nada a carregar."; fi
